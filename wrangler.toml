# Cloudflare Pages Configuration for GlowNatura Admin Panel
name = "glownatura-admin"
compatibility_date = "2024-01-01"

# Note: Cloudflare Pages will automatically detect Next.js and build correctly
# The build output will be in .next/standalone for production

# Node.js compatibility for Next.js SSR
compatibility_flags = ["nodejs_compat"]

[build]
command = "npm run build"

# Build environment variables
[[build.environment_variables]]
NODE_VERSION = "22.16.0"

# Production environment variables
# These should be set in Cloudflare Pages dashboard > Settings > Environment Variables:
# - NEXT_PUBLIC_API_URL = https://backendglownaturas.onrender.com
# - NEXT_PUBLIC_ADMIN_URL = https://glownatura-admin.pages.dev
# - NODE_ENV = production

